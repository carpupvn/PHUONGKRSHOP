<!DOCTYPE html>

<body>
    <!-- Header -->
    <header>
        <div class="container header-content">
            <h1 class="logo">🛍️ Cửa hàng Mẹ</h1>

        </div>
        <!-- Thông tin liên hệ mẹ (hiển thị trên mobile thì nhỏ gọn) -->
        <div class="container contact-bar">
            <a href="https://www.facebook.com/phuong.doan.9619934" target="_blank" class="contact-link"><i class="fab fa-facebook"></i> Phương Doan</a>
            <a href="tel:0913326354" class="contact-link"><i class="fas fa-phone"></i> 0913 326 354</a>

    <main class="container">

    <!-- Footer -->

            <div class="footer-info">
                <p><strong>Liên hệ mẹ:</strong> <a href="https://www.facebook.com/phuong.doan.9619934" target="_blank">Facebook</a> | <a href="tel:0913326354">0913 326 354</a></p>

                <p class="copyright">&copy; 2026 Cửa hàng Mẹ. Thiết kế bởi Ngọc Phước.</p>
            </div>
        </div>
    </footer>

    <!-- Modal chi tiết sản phẩm -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
